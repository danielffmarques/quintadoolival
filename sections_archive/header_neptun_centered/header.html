<!-- Variante Arquivada: Header Hotel Neptun Centralizado (Logo ao Centro)
     Data: 2026-10-21
     Origem: Quinta do Olival
     Descrição: Header com estrutura de 3 zonas: Botão Reservar à esquerda, Logo original centralizado, Menu e Idioma à direita.
-->
<header class="header header-neptun" id="mainHeader">
  <div class="neptun-header-inner">
    <div class="neptun-header-left">
      <a href="reservas.html" class="neptun-book-btn" aria-label="Reservar Estadia">
        <span>Reservar Agora</span>
      </a>
    </div>

    <div class="neptun-header-center">
      <a href="index.html" class="neptun-logo-link" aria-label="Quinta do Olival - Página Inicial">
        <img src="assets/logos/logo.png" alt="Quinta do Olival" class="neptun-original-logo">
      </a>
    </div>

    <div class="neptun-header-right">
      <button class="mobile-menu-btn" aria-label="Abrir Menu" aria-expanded="false">
        <svg class="icon-svg-lg" viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <nav class="neptun-nav" aria-label="Navegação Principal">
        <ul class="nav-menu">
          <li><a href="#quinta" class="nav-link">A Quinta</a></li>
          <li><a href="#casas" class="nav-link">Casas</a></li>
          <li><a href="#experiencias" class="nav-link">Arredores</a></li>
          <li><a href="#opinioes" class="nav-link">Opiniões</a></li>
          <li><a href="#faqs" class="nav-link">FAQs</a></li>
        </ul>
      </nav>

      <div class="neptun-lang-switch" aria-label="Seleção de Idioma">
        <span class="lang-option active">PT</span>
        <span class="lang-slash">/</span>
        <a href="#en" class="lang-option" title="English">EN</a>
      </div>
    </div>
  </div>
</header>
